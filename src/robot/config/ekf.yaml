frequency: 30 

two_d_mode: true # Restricts the EKF to 2D (x, y, yaw only). Ignores z, roll, pitch.

publish_tf: true # odom -> base_link

map_frame: map
odom_frame: odom
base_link_frame: base_link
world_frame: odom # for amcl world_frame: map otherwise odom

odom0: /robot/odom
odom0_config: [true, true, false,
                false, false, true,
                false, false, false,
                false, false, false,
                false, false, false]
odom0_differential: true

imu0: /device/imu/data
imu0_config: [false, false, false,
                false, false, true,
                false, false, false,
                false, false, false,
                true, true, true]
imu0_differential: false

