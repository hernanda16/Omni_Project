# Particle Filter
min_particles: 500
max_particles: 3000
kld_err: 0.01
kld_z: 0.99

# Laser Model
laser_min_range: 0.1
laser_max_range: 5.0
laser_max_beams: 360 # Should match your LIDAR's specs

# Odometry Model
odom_model_type: diff # Set to "diff" for differential drive
odom_alpha1: 0.2
odom_alpha2: 0.2
odom_alpha3: 0.2
odom_alpha4: 0.2
odom_alpha5: 0.2 # Optional, helps if there’s drift

# Initial Pose Estimate
initial_pose_x: 0.0
initial_pose_y: 0.0
initial_pose_a: 0.0

# Frame IDs (IMPORTANT for your TF structure)
base_frame_id: "base_footprint_fake"
odom_frame_id: "odom_fake"
global_frame_id: "map"

# TF & Timing Configuration
tf_broadcast: true
tf_buffer_size: 120.0 # Large buffer for better sim stability
transform_tolerance: 0.5 # Slightly high to tolerate fast updates

# Update thresholds (when AMCL updates the pose)
update_min_d: 0.1 # Update only when robot moves 10cm
update_min_a: 0.2 # Update only when robot rotates 0.2 rad
